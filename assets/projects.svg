<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching Midnight Navy theme -->
    <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="35%" stop-color="#0B1630"/>
      <stop offset="70%" stop-color="#0E1E42"/>
      <stop offset="100%" stop-color="#091226"/>
    </linearGradient>

    <!-- Card Border Gradient (Electric Cyan to Neon Red to Royal Blue) -->
    <linearGradient id="proj-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF354F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Sub-card backgrounds -->
    <linearGradient id="card-inner-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F244C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0A152E" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="card-inner-bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1848" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A152E" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="card-inner-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2338" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0A152E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="btn-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <linearGradient id="btn-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Pill Background -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10254C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B1832" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.92); }
    }
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }
    .pulse-dot { animation: livePulse 2s ease-in-out infinite; transform-origin: center; }
    .card-border-glow { animation: borderGlow 3s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .card-border-glow { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- Container Box -->
  <rect x="8" y="8" width="944" height="504" rx="20" fill="url(#proj-bg)"/>
  <rect x="8" y="8" width="944" height="504" rx="20" fill="none" stroke="url(#proj-border)" stroke-width="1.8"/>

  <!-- ================= SECTION HEADER ================= -->
  <g transform="translate(45, 46)">
    <!-- Main Heading -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', sans-serif" font-size="22" font-weight="900" fill="#F4F6FC" letter-spacing="1">FEATURED ENGINEERING &amp; REPOSITORIES</text>
    
    <!-- Subtitle Category Tag -->
    <text x="0" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#93C5FD" letter-spacing="1.5">04 / PRODUCTION / 3D WEBGL / CULTURAL AUDIO / APIS</text>

