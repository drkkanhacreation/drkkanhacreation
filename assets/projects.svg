      <line x1="16" y1="6" x2="16" y2="17" stroke="#38BDF8" stroke-width="1.2"/>
      <line x1="16" y1="17" x2="6" y2="11" stroke="#38BDF8" stroke-width="1.2"/>
      <line x1="16" y1="17" x2="26" y2="11" stroke="#38BDF8" stroke-width="1.2"/>
      <line x1="16" y1="17" x2="16" y2="27" stroke="#38BDF8" stroke-width="1.2"/>
