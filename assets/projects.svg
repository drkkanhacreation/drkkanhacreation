    <!-- Project Title & Subtitle -->
    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#F4F6FC" letter-spacing="0.5">
