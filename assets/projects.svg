      <polygon points="8,15 13,0 17,0 12,15" fill="#FF354F"/>
      <polygon points="16,15 21,0 25,0 20,15" fill="#FF354F"/>
    </g>
  </g>

  <!-- Hairline Divider -->
  <line x1="45" y1="84" x2="915" y2="84" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ================= CARD 1: portfolio3d (y=100) ================= -->
  <g transform="translate(42, 100)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="876" height="110" rx="12" fill="url(#card-inner-bg-1)"/>
    <rect x="0" y="0" width="876" height="110" rx="12" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" class="card-border-glow"/>

