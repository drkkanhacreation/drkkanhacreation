<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="35%" stop-color="#0E1B38"/>
      <stop offset="70%" stop-color="#142956"/>
      <stop offset="100%" stop-color="#091122"/>
    </linearGradient>

    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF354F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Isometric Cube Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0E1D3F"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10224A"/>
    </linearGradient>

    <!-- Orbit gradients -->
    <linearGradient id="stk-orbit-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="stk-orbit-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF354F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="tech-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10224A"/>
      <stop offset="100%" stop-color="#0A1428"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes orbit-dashes {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 300; }
    }
    .orbit-anim-1 {
      animation: orbit-dashes 22s linear infinite;
    }
    .orbit-anim-2 {
      animation: orbit-dashes 18s linear infinite reverse;
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-anim-1, .orbit-anim-2 { animation: none !important; }
    }
  </style>

  <!-- Base Card -->
  <rect x="8" y="8" width="944" height="394" rx="22" fill="url(#stack-bg)"/>
  <rect x="8" y="8" width="944" height="394" rx="22" fill="none" stroke="url(#stack-border)" stroke-width="1.8"/>

  <!-- Section Header -->
  <g transform="translate(45, 34)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Impact', sans-serif" font-size="26" font-weight="900" fill="#F4F6FC" letter-spacing="1">TOOLS CHANGE. CURIOSITY DOESN'T.</text>
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" fill="#93C5FD" letter-spacing="1.5">03 / SYSTEMS / INTELLIGENCE / AUTONOMY</text>

    <!-- Slanted Red Bars /// -->
    <g transform="translate(845, -12)">
      <polygon points="0,14 5,0 9,0 4,14" fill="#FF354F"/>
      <polygon points="8,14 13,0 17,0 12,14" fill="#FF354F"/>
      <polygon points="16,14 21,0 25,0 20,14" fill="#FF354F"/>
    </g>
  </g>

  <!-- Horizontal Hairline Divider -->
  <line x1="45" y1="64" x2="915" y2="64" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ================= LEFT: 3D ISOMETRIC CUBE + ORBITAL MATRIX (CENTERED AT X=242, Y=190) ================= -->
  <g transform="translate(242, 185)">
    <!-- Orbit 1 (tilted -25 deg, rx=145, ry=48) -->
    <g transform="rotate(-25)">
      <ellipse cx="0" cy="0" rx="145" ry="48" fill="none" stroke="url(#stk-orbit-1)" stroke-width="1.5" stroke-dasharray="6 5" class="orbit-anim-1"/>
      <!-- Upright Node 1: ROS -->
      <g transform="translate(-135, 0) rotate(25)">
        <circle cx="0" cy="0" r="14" fill="#0A1428" stroke="#38BDF8" stroke-width="1.4"/>
        <text x="0" y="3.5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8.5" font-weight="800" fill="#38BDF8">ROS</text>
      </g>
      <!-- Upright Node 2: CV -->
      <g transform="translate(135, 0) rotate(25)">
        <circle cx="0" cy="0" r="14" fill="#0A1428" stroke="#38BDF8" stroke-width="1.4"/>
        <text x="0" y="3.5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" font-weight="800" fill="#38BDF8">CV</text>
      </g>
    </g>

    <!-- Orbit 2 (tilted 35 deg, rx=130, ry=45) -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="url(#stk-orbit-2)" stroke-width="1.5" stroke-dasharray="6 5" class="orbit-anim-2"/>
      <!-- Upright Node 3: TORCH -->
      <g transform="translate(0, -45) rotate(-35)">
        <circle cx="0" cy="0" r="14" fill="#180A1E" stroke="#FF354F" stroke-width="1.4"/>
        <text x="0" y="3.5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="7" font-weight="800" fill="#FF708F">TORCH</text>
      </g>
      <!-- Upright Node 4: C++ -->
      <g transform="translate(0, 45) rotate(-35)">
        <circle cx="0" cy="0" r="14" fill="#0A1428" stroke="#38BDF8" stroke-width="1.4"/>
        <text x="0" y="3.5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8.5" font-weight="800" fill="#38BDF8">C++</text>
      </g>
    </g>

    <!-- Pulsing Red Laser Energy Line -->
    <line x1="-25" y1="18" x2="105" y2="-42" stroke="#FF354F" stroke-width="2.2" stroke-opacity="0.85"/>
    <circle cx="105" cy="-42" r="3.5" fill="#FF354F"/>

    <!-- 3D Isometric Center Cube -->
    <g transform="translate(0, -8)">
      <polygon points="0,-34 28,-18 0,-2 -28,-18" fill="url(#cube-top)"/>
      <polygon points="-28,-18 0,-2 0,32 -28,16" fill="url(#cube-left)"/>
      <polygon points="0,-2 28,-18 28,16 0,32" fill="url(#cube-right)"/>

      <text x="0" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="1">IG</text>
      <text x="0" y="-12" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8.5" font-weight="800" fill="#FFFFFF">AI</text>
    </g>
  </g>

  <!-- Left Telemetry Status Pill (Balanced under Orbit) -->
  <g transform="translate(87, 308)">
    <rect x="0" y="0" width="310" height="30" rx="6" fill="#0A1428" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="16" cy="15" r="3.5" fill="#10B981"/>
    <text x="28" y="19" font-family="'SF Mono', monospace" font-size="8.5" font-weight="800" fill="#38BDF8" letter-spacing="1">AUTONOMOUS FLIGHT STACK</text>
    <text x="180" y="19" font-family="'SF Mono', monospace" font-size="8" fill="#93C5FD">v4.2 // SYS: LOCKED</text>
    <rect x="264" y="6" width="38" height="18" rx="3" fill="#10224A" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="283" y="18" text-anchor="middle" font-family="'SF Mono', monospace" font-size="7.5" font-weight="900" fill="#38BDF8">SYNC</text>
  </g>

  <!-- Vertical Divider Line (Clean 180px span) -->
  <line x1="440" y1="75" x2="440" y2="345" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ================= RIGHT: 3x3 CATEGORIZED TECH CHIPS (PERFECTLY ALIGNED) ================= -->
  <g transform="translate(470, 75)">
    <!-- Group 1: 01 / LANGUAGES & ROBOTICS -->
    <text x="0" y="12" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" fill="#93C5FD" letter-spacing="0.8">01 / LANGUAGES &amp; ROBOTICS</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
      <line x1="12" y1="36" x2="45" y2="36" stroke="#38BDF8" stroke-width="2"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F6FC">⚡ C++</text>

      <rect x="146" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
      <line x1="158" y1="36" x2="191" y2="36" stroke="#38BDF8" stroke-width="2"/>
      <text x="160" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F6FC">🐍 Python</text>

      <rect x="292" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
      <line x1="304" y1="36" x2="337" y2="36" stroke="#38BDF8" stroke-width="2"/>
      <text x="306" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F6FC">🤖 ROS / ROS2</text>
    </g>

    <!-- Group 2: 02 / PERCEPTION & VISION -->
    <g transform="translate(0, 78)">
      <text x="0" y="12" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" fill="#93C5FD" letter-spacing="0.8">02 / PERCEPTION &amp; VISION</text>
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#FF354F" stroke-opacity="0.4" stroke-width="1"/>
        <line x1="12" y1="36" x2="45" y2="36" stroke="#FF354F" stroke-width="2"/>
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FF708F">🧠 PyTorch</text>

        <rect x="146" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
        <line x1="158" y1="36" x2="191" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="160" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F6FC">👁️ OpenCV</text>

        <rect x="292" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
        <line x1="304" y1="36" x2="337" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="306" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F6FC">🛸 Embedded</text>
      </g>
    </g>

    <!-- Group 3: 03 / WEB, CLOUD & CONTROL -->
    <g transform="translate(0, 156)">
      <text x="0" y="12" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" fill="#93C5FD" letter-spacing="0.8">03 / WEB, CLOUD &amp; CONTROL</text>
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
        <line x1="12" y1="36" x2="45" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F6FC">⚛️ React/Next</text>

        <rect x="146" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
        <line x1="158" y1="36" x2="191" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="160" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F4F6FC">TS TypeScript</text>

        <rect x="292" y="0" width="136" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#FF354F" stroke-opacity="0.4" stroke-width="1"/>
        <line x1="304" y1="36" x2="337" y2="36" stroke="#FF354F" stroke-width="2"/>
        <text x="306" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FF708F">🐋 Docker/API</text>
      </g>
    </g>

    <!-- Footer Tagline Row (Flush aligned with right edge at X=428) -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" font-family="'SF Mono', monospace" font-size="9" font-weight="700" fill="#93C5FD" letter-spacing="0.8">CODE IS THE TOOL. AUTONOMY IS THE MISSION.</text>
      <text x="428" y="0" text-anchor="end" font-family="'SF Mono', monospace" font-size="9" font-weight="700" fill="#FF708F" letter-spacing="1">BUILD / TEST / FLY / REPEAT</text>
    </g>
  </g>
</svg>