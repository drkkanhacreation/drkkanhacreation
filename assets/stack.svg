<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="35%" stop-color="#0E1B38"/>
      <stop offset="70%" stop-color="#142956"/>
      <stop offset="100%" stop-color="#091122"/>
    </linearGradient>

    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF354F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Isometric Cube Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0E1D3F"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10224A"/>
    </linearGradient>

    <!-- Orbit gradients -->
    <linearGradient id="stk-orbit-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="stk-orbit-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF354F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="tech-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10224A"/>
      <stop offset="100%" stop-color="#0A1428"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes orbit-dashes {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 300; }
    }
    @keyframes node-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .orbit-anim-1 {
      animation: orbit-dashes 22s linear infinite;
    }
    .orbit-anim-2 {
      animation: orbit-dashes 18s linear infinite reverse;
    }
    .pulse-node {
      animation: node-pulse 3s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-anim-1, .orbit-anim-2, .pulse-node { animation: none !important; }
    }
  </style>

  <!-- Base Card -->
  <rect x="8" y="8" width="944" height="394" rx="22" fill="url(#stack-bg)"/>
  <rect x="8" y="8" width="944" height="394" rx="22" fill="none" stroke="url(#stack-border)" stroke-width="1.8"/>

  <!-- Section Header -->
  <g transform="translate(45, 34)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Impact', sans-serif" font-size="26" font-weight="900" fill="#F4F6FC" letter-spacing="1">TOOLS CHANGE. CURIOSITY DOESN'T.</text>
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" fill="#93C5FD" letter-spacing="1.5">03 / SYSTEMS / INTELLIGENCE / AUTONOMY</text>

    <!-- Slanted Red Bars /// -->
    <g transform="translate(845, -12)">
      <polygon points="0,14 5,0 9,0 4,14" fill="#FF354F"/>
      <polygon points="8,14 13,0 17,0 12,14" fill="#FF354F"/>
      <polygon points="16,14 21,0 25,0 20,14" fill="#FF354F"/>
    </g>
  </g>

  <!-- Horizontal Hairline Divider -->
  <line x1="45" y1="64" x2="915" y2="64" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ================= LEFT: 3D ISOMETRIC CUBE + ORBITAL MATRIX ================= -->
  <g transform="translate(230, 220)">
    <!-- Orbit 1 (tilted -25 deg) -->
    <g transform="rotate(-25)">
      <ellipse cx="0" cy="0" rx="170" ry="60" fill="none" stroke="url(#stk-orbit-1)" stroke-width="1.6" stroke-dasharray="6 5" class="orbit-anim-1"/>
      <!-- Node: ROS -->
      <g transform="translate(-160, 0)" class="pulse-node">
        <circle cx="0" cy="0" r="16" fill="#10224A" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" font-weight="800" fill="#38BDF8">ROS</text>
      </g>
      <!-- Node: OpenCV -->
      <g transform="translate(160, 0)" class="pulse-node">
        <circle cx="0" cy="0" r="16" fill="#10224A" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" font-weight="800" fill="#38BDF8">CV</text>
      </g>
    </g>

    <!-- Orbit 2 (tilted 35 deg) -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="150" ry="55" fill="none" stroke="url(#stk-orbit-2)" stroke-width="1.6" stroke-dasharray="6 5" class="orbit-anim-2"/>
      <!-- Node: PyTorch -->
      <g transform="translate(0, -55)" class="pulse-node">
        <circle cx="0" cy="0" r="16" fill="#20152E" stroke="#FF354F" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" font-weight="800" fill="#FF708F">TORCH</text>
      </g>
      <!-- Node: C++ -->
      <g transform="translate(0, 55)" class="pulse-node">
        <circle cx="0" cy="0" r="16" fill="#10224A" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" font-weight="800" fill="#38BDF8">C++</text>
      </g>
    </g>

    <!-- Pulsing Red Laser Energy Line -->
    <line x1="-30" y1="20" x2="110" y2="-40" stroke="#FF354F" stroke-width="2.5" stroke-opacity="0.85"/>
    <circle cx="110" cy="-40" r="4" fill="#FF354F"/>

    <!-- 3D Isometric Center Cube (Exact Ref 3 visual) -->
    <g transform="translate(0, -10)">
      <!-- Top Face -->
      <polygon points="0,-38 32,-20 0,-2 -32,-20" fill="url(#cube-top)"/>
      <!-- Left Face -->
      <polygon points="-32,-20 0,-2 0,36 -32,18" fill="url(#cube-left)"/>
      <!-- Right Face -->
      <polygon points="0,-2 32,-20 32,18 0,36" fill="url(#cube-right)"/>

      <!-- Cube Core Monogram (DKC / IG) -->
      <text x="0" y="16" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="1">IG</text>
      <text x="0" y="-14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" font-weight="800" fill="#FFFFFF">AI</text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="450" y1="80" x2="450" y2="350" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- ================= RIGHT: 3x3 CATEGORIZED TECH CHIPS (Ref 3) ================= -->
  <g transform="translate(480, 80)">
    <!-- Group 1: 01 / LANGUAGES & EMBEDDED -->
    <text x="0" y="12" font-family="'SF Mono', monospace" font-size="10" font-weight="700" fill="#93C5FD">01 / LANGUAGES &amp; ROBOTICS</text>
    <g transform="translate(0, 22)">
      <!-- Card 1: C++ -->
      <rect x="0" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <line x1="12" y1="36" x2="45" y2="36" stroke="#38BDF8" stroke-width="2"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FC">⚡ C++</text>

      <!-- Card 2: Python -->
      <rect x="145" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <line x1="157" y1="36" x2="190" y2="36" stroke="#38BDF8" stroke-width="2"/>
      <text x="159" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FC">🐍 Python</text>

      <!-- Card 3: ROS -->
      <rect x="290" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <line x1="302" y1="36" x2="335" y2="36" stroke="#38BDF8" stroke-width="2"/>
      <text x="304" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FC">🤖 ROS / ROS2</text>
    </g>

    <!-- Group 2: 02 / PERCEPTION & VISION -->
    <g transform="translate(0, 80)">
      <text x="0" y="12" font-family="'SF Mono', monospace" font-size="10" font-weight="700" fill="#93C5FD">02 / PERCEPTION &amp; VISION</text>
      <g transform="translate(0, 22)">
        <!-- Card 4: PyTorch -->
        <rect x="0" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#FF354F" stroke-opacity="0.35" stroke-width="1"/>
        <line x1="12" y1="36" x2="45" y2="36" stroke="#FF354F" stroke-width="2"/>
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF708F">🧠 PyTorch</text>

        <!-- Card 5: OpenCV -->
        <rect x="145" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <line x1="157" y1="36" x2="190" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="159" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FC">👁️ OpenCV</text>

        <!-- Card 6: Embedded Systems -->
        <rect x="290" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <line x1="302" y1="36" x2="335" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="304" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FC">🛸 Embedded</text>
      </g>
    </g>

    <!-- Group 3: 03 / WEB, CLOUD & UI -->
    <g transform="translate(0, 160)">
      <text x="0" y="12" font-family="'SF Mono', monospace" font-size="10" font-weight="700" fill="#93C5FD">03 / WEB, CLOUD &amp; CONTROL</text>
      <g transform="translate(0, 22)">
        <!-- Card 7: React / Next.js -->
        <rect x="0" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <line x1="12" y1="36" x2="45" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FC">⚛️ React/Next</text>

        <!-- Card 8: TypeScript -->
        <rect x="145" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <line x1="157" y1="36" x2="190" y2="36" stroke="#38BDF8" stroke-width="2"/>
        <text x="159" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6FC">TS TypeScript</text>

        <!-- Card 9: Docker & Cloud -->
        <rect x="290" y="0" width="135" height="42" rx="8" fill="url(#tech-card-bg)" stroke="#FF354F" stroke-opacity="0.35" stroke-width="1"/>
        <line x1="302" y1="36" x2="335" y2="36" stroke="#FF354F" stroke-width="2"/>
        <text x="304" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF708F">🐋 Docker/API</text>
      </g>
    </g>

    <!-- Footer Tagline Row (Ref 3) -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" font-family="'SF Mono', monospace" font-size="9" fill="#93C5FD" letter-spacing="1">CODE IS THE TOOL. AUTONOMY IS THE MISSION.</text>
      <text x="280" y="0" font-family="'SF Mono', monospace" font-size="9" fill="#FF708F" letter-spacing="1">BUILD / TEST / FLY / REPEAT</text>
    </g>
  </g>
</svg>