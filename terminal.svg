<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching Midnight Navy theme -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="40%" stop-color="#0B1630"/>
      <stop offset="80%" stop-color="#0E1E42"/>
      <stop offset="100%" stop-color="#091226"/>
    </linearGradient>

    <!-- Outer Border Gradient (Electric Cyan to Neon Red to Royal Blue) -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF354F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Header bar subtle gradient -->
    <linearGradient id="term-header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1B38"/>
      <stop offset="100%" stop-color="#081022"/>
    </linearGradient>

    <!-- Sub-panel background -->
    <linearGradient id="telemetry-box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10234C" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#09142B" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    
    /* 11-second sequence animation using pure opacity */
    @keyframes seq1 { 0% { opacity: 0; } 4%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes seq2 { 0%, 8% { opacity: 0; } 13%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes seq3 { 0%, 18% { opacity: 0; } 23%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes seq4 { 0%, 28% { opacity: 0; } 33%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes seq5 { 0%, 38% { opacity: 0; } 43%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes seq6 { 0%, 48% { opacity: 0; } 53%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes seq7 { 0%, 58% { opacity: 0; } 63%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes seq8 { 0%, 68% { opacity: 0; } 73%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }

    @keyframes live-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .line-1 { animation: seq1 11s ease-out infinite; }
    .line-2 { animation: seq2 11s ease-out infinite; }
    .line-3 { animation: seq3 11s ease-out infinite; }
    .line-4 { animation: seq4 11s ease-out infinite; }
    .line-5 { animation: seq5 11s ease-out infinite; }
    .line-6 { animation: seq6 11s ease-out infinite; }
    .line-7 { animation: seq7 11s ease-out infinite; }
    .line-8 { animation: seq8 11s ease-out infinite; }

    .term-cursor { animation: blink 0.85s step-start infinite; }
    .live-pulse { animation: live-dot 1.8s ease-in-out infinite; }
    
    @media (prefers-reduced-motion: reduce) {
      .line-1, .line-2, .line-3, .line-4, .line-5, .line-6, .line-7, .line-8 {
        animation: none !important;
        opacity: 1 !important;
      }
      .term-cursor { animation: none !important; opacity: 1 !important; }
      .live-pulse { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- Container Box -->
  <rect x="8" y="8" width="944" height="314" rx="18" fill="url(#term-bg)"/>
  <rect x="8" y="8" width="944" height="314" rx="18" fill="none" stroke="url(#term-border)" stroke-width="1.8"/>

  <!-- ================= TOP HEADER BAR ================= -->
  <rect x="8" y="8" width="944" height="42" rx="18" fill="url(#term-header-bg)"/>
  <rect x="8" y="36" width="944" height="14" fill="url(#term-header-bg)"/>
  <line x1="8" y1="50" x2="952" y2="50" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Window Controls (Red, Yellow, Green macOS-style dots) -->
  <circle cx="34" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="54" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="74" cy="28" r="6" fill="#27C93F"/>

  <!-- Terminal Window Title -->
  <g transform="translate(100, 32)">
    <text x="0" y="0" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', monospace" font-size="11.5" font-weight="700" fill="#93C5FD" letter-spacing="0.8">
      swadhinjit@flight-station: <tspan fill="#38BDF8">~/mad_x_honors</tspan> <tspan fill="#64748B">(verified-trophies)</tspan>
    </text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(760, 20)">
    <rect x="0" y="0" width="172" height="22" rx="6" fill="#081428" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="12" cy="11" r="4" fill="#F59E0B" class="live-pulse"/>
    <text x="24" y="14.5" font-family="'SF Mono', monospace" font-size="9.5" font-weight="800" fill="#F59E0B" letter-spacing="0.8">LEADER &#x2022; TEAM MAD-X</text>
  </g>

  <!-- ================= TERMINAL BODY ================= -->
  <g transform="translate(32, 60)">
    
    <!-- LINE 1: The Command (y=20) -->
    <g class="line-1">
      <text x="0" y="20" font-family="'SF Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600">
        <tspan fill="#10B981" font-weight="800">swadhin@drone-core</tspan><tspan fill="#64748B">:</tspan><tspan fill="#38BDF8">~</tspan><tspan fill="#F4F6FC">$</tspan>
        <tspan fill="#F4F6FC"> ./fetch_achievements.sh --team=MAD-X --leader="Swadhinjit Sahoo" --verified=true</tspan>
      </text>
    </g>

    <!-- LINE 2: 1st Place TRITHON 2026 (y=44) -->
    <g class="line-2">
      <text x="0" y="44" font-family="'SF Mono', monospace" font-size="11.5">
        <tspan fill="#64748B">[2026]</tspan>
        <tspan fill="#F59E0B" font-weight="800"> [1st PLACE / WINNER] </tspan>
        <tspan fill="#F4F6FC" font-weight="700">TRITHON Hackathon</tspan>
        <tspan fill="#CBD5E1"> &#x2022; Trident Academy of Technology (&#x20B9;30,000) ... </tspan>
        <tspan fill="#10B981" font-weight="800">[CHAMPION]</tspan>
      </text>
    </g>

    <!-- LINE 3: 1st Place IIT Pravaah 2026 (y=68) -->
    <g class="line-3">
      <text x="0" y="68" font-family="'SF Mono', monospace" font-size="11.5">
        <tspan fill="#64748B">[2026]</tspan>
        <tspan fill="#F59E0B" font-weight="800"> [1st PLACE / WINNER] </tspan>
        <tspan fill="#F4F6FC" font-weight="700">IIT Pravaah Autonomous Robotics</tspan>
        <tspan fill="#CBD5E1"> &#x2022; IIT Bhubaneswar (&#x20B9;10,000) ... </tspan>
        <tspan fill="#10B981" font-weight="800">[IIT BBSR GOLD]</tspan>
      </text>
    </g>

    <!-- LINE 4: PAN-INDIA WINNER Sustainovation 2025 (y=92) -->
    <g class="line-4">
      <text x="0" y="92" font-family="'SF Mono', monospace" font-size="11.5">
        <tspan fill="#64748B">[2025]</tspan>
        <tspan fill="#38BDF8" font-weight="800"> [PAN-INDIA WINNER] </tspan>
        <tspan fill="#F4F6FC" font-weight="700">Sustainovation National Challenge</tspan>
        <tspan fill="#CBD5E1"> &#x2022; Amity University Noida (&#x20B9;25,000) ... </tspan>
        <tspan fill="#38BDF8" font-weight="800">[NATIONAL]</tspan>
      </text>
    </g>

    <!-- LINE 5: 2nd Place BPUT & Srusti Tech Hack (y=116) -->
    <g class="line-5">
      <text x="0" y="116" font-family="'SF Mono', monospace" font-size="11.5">
        <tspan fill="#64748B">[2025-26]</tspan>
        <tspan fill="#93C5FD" font-weight="800"> [2nd PLACE / RUNNER] </tspan>
        <tspan fill="#F4F6FC" font-weight="700">BPUT Hackathon &amp; Srusti Tech Hack</tspan>
        <tspan fill="#CBD5E1"> &#x2022; BPUT Rourkela (&#x20B9;30,000) ... </tspan>
        <tspan fill="#10B981" font-weight="800">[PODIUM]</tspan>
      </text>
    </g>

    <!-- LINE 6: IIT Pravaah Multi-Year Multi-Podium (y=140) -->
    <g class="line-6">
      <text x="0" y="140" font-family="'SF Mono', monospace" font-size="11.5">
        <tspan fill="#64748B">[2024-26]</tspan>
        <tspan fill="#FFBD2E" font-weight="800"> [6x PODIUM FINISH] </tspan>
        <tspan fill="#F4F6FC" font-weight="700">IIT Pravaah Innovation Expo &amp; Robo Soccer</tspan>
        <tspan fill="#CBD5E1"> &#x2022; IIT Bhubaneswar ... </tspan>
        <tspan fill="#38BDF8" font-weight="800">[IIT BBSR]</tspan>
      </text>
    </g>

    <!-- LINE 7: HONORS & PRIZE POOL BANNER (y=160 to y=198) -->
    <g class="line-7" transform="translate(0, 160)">
      <rect x="0" y="0" width="896" height="38" rx="8" fill="url(#telemetry-box-bg)" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.85"/>
      <!-- Small trophy icon badge -->
      <circle cx="20" cy="19" r="9" fill="#F59E0B" fill-opacity="0.2"/>
      <path d="M15 14 H25 V19 C25 21.5 22.5 23 20 23 C17.5 23 15 21.5 15 19 Z M17 23 L16 26 H24 L23 23" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="23" font-family="'SF Mono', monospace" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="0.8">
        MISSION RECORD: 12+ PODIUM WINS &#x2022; &#x20B9;1,20,000+ CASH PRIZE POOL &#x2022; IIT &amp; PAN-INDIA CHAMPION
      </text>
      <!-- Metric tags on the right -->
      <rect x="670" y="8" width="105" height="22" rx="4" fill="#081428" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="722" y="22" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" fill="#38BDF8">TEAM: MAD-X</text>
      <rect x="782" y="8" width="102" height="22" rx="4" fill="#081428" stroke="#10B981" stroke-width="0.8"/>
      <text x="833" y="22" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" fill="#10B981">ROLE: LEADER</text>
    </g>

    <!-- LINE 8: Next Ready Prompt with Blinking Cursor (y=226) -->
    <g class="line-8">
      <text x="0" y="226" font-family="'SF Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600">
        <tspan fill="#10B981" font-weight="800">swadhin@drone-core</tspan><tspan fill="#64748B">:</tspan><tspan fill="#38BDF8">~</tspan><tspan fill="#F4F6FC">$</tspan>
        <tspan fill="#38BDF8"> echo "Autonomous robotics engineer &#x2022; Hackathon champion &#x2022; Ready for deployment."</tspan>
        <tspan fill="#38BDF8" class="term-cursor" font-weight="900"> &#x2588;</tspan>
      </text>
    </g>

  </g>

</svg>